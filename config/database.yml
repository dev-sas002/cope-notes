
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV['DATABASE_HOST'] %>
  port: <%= ENV.fetch('DATABASE_PORT', 5432) %>
  username: <%= ENV['DATABASE_USER'] %>
  password: <%= ENV['DATABASE_PASSWORD'] %>

development:
  <<: *default
  database: cope_notes_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: cope_notes_test

production:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME', 'cope_notes_production') %>
  username: <%= ENV.fetch('DATABASE_USER', 'cope_notes') %>
  password: <%= ENV['DATABASE_PASSWORD'] || ENV['COPE_NOTES_DATABASE_PASSWORD'] %>
